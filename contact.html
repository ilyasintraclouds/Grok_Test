<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - IntraClouds</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style> body { font-family: 'Inter', system-ui, sans-serif; } </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-white">

  <!-- Navbar (Copy same navbar) -->
  <nav class="fixed top-0 w-full bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">IC</div>
        <h1 class="text-2xl font-semibold">IntraClouds</h1>
      </div>
      
      <div class="flex items-center gap-8 font-medium">
        <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400">Home</a>
        <a href="services.html" class="hover:text-blue-600 dark:hover:text-blue-400">Services</a>
        <a href="about.html" class="hover:text-blue-600 dark:hover:text-blue-400">About</a>
        <a href="contact.html" class="hover:text-blue-600 dark:hover:text-blue-400">Contact</a>
      </div>

      <button id="theme-toggle" class="p-3 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
        <i id="theme-icon" class="fas fa-moon text-xl"></i>
      </button>
    </div>
  </nav>

  <div class="pt-28 max-w-4xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold text-center mb-4">Get in Touch</h1>
    <p class="text-center text-zinc-600 dark:text-zinc-400 mb-12">Reach out to us for inquiries or collaboration opportunities.</p>

    <div class="grid md:grid-cols-2 gap-8">
      <div class="bg-white dark:bg-zinc-900 p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800">
        <h3 class="font-semibold mb-6 text-xl">Contact Information</h3>
        <div class="space-y-6">
          <a href="mailto:ahsan.rafique@intraclouds.com" class="flex items-center gap-4 hover:text-blue-600">
            <i class="fas fa-envelope text-2xl"></i>
            <span>ahsan.rafique@intraclouds.com</span>
          </a>
          <a href="tel:+923143330888" class="flex items-center gap-4 hover:text-blue-600">
            <i class="fas fa-phone text-2xl"></i>
            <span>+92 314 3330888</span>
          </a>
          <a href="https://www.linkedin.com/company/intraclouds" target="_blank" class="flex items-center gap-4 hover:text-blue-600">
            <i class="fab fa-linkedin text-2xl"></i>
            <span>LinkedIn</span>
          </a>
        </div>
      </div>

      <div class="bg-white dark:bg-zinc-900 p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800">
        <h3 class="font-semibold mb-6 text-xl">Let's Build Something Amazing Together!</h3>
        <form class="space-y-6">
          <input type="text" placeholder="Your Name" class="w-full px-5 py-4 rounded-2xl border border-zinc-300 dark:border-zinc-700 bg-transparent">
          <input type="email" placeholder="Business Email" class="w-full px-5 py-4 rounded-2xl border border-zinc-300 dark:border-zinc-700 bg-transparent">
          <textarea placeholder="Your Message / Project Details" rows="5" class="w-full px-5 py-4 rounded-2xl border border-zinc-300 dark:border-zinc-700 bg-transparent"></textarea>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-semibold">Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Theme Toggle Script
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      icon.classList.replace('fa-moon', 'fa-sun');
    }
    
    toggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        icon.classList.replace('fa-moon', 'fa-sun');
        localStorage.setItem('theme', 'dark');
      } else {
        icon.classList.replace('fa-sun', 'fa-moon');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
