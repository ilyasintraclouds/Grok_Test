<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntraClouds - Transform Ideas Into Technology</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-white transition-colors duration-300">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">IC</div>
        <h1 class="text-2xl font-semibold">IntraClouds</h1>
      </div>
      
      <div class="flex items-center gap-8 font-medium">
        <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400">Home</a>
        <a href="services.html" class="hover:text-blue-600 dark:hover:text-blue-400">Services</a>
        <a href="about.html" class="hover:text-blue-600 dark:hover:text-blue-400">About</a>
        <a href="contact.html" class="hover:text-blue-600 dark:hover:text-blue-400">Contact</a>
      </div>

      <button id="theme-toggle" class="p-3 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
        <i id="theme-icon" class="fas fa-moon text-xl"></i>
      </button>
    </div>
  </nav>

  <div class="pt-24 pb-20 text-center">
    <h1 class="text-5xl md:text-6xl font-bold leading-tight">We Transform Ideas Into Technology</h1>
    <p class="mt-6 text-xl text-zinc-600 dark:text-zinc-400">Innovative Cloud, AI, Web & Mobile Solutions</p>
  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    
    toggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        icon.classList.replace('fa-moon', 'fa-sun');
        localStorage.setItem('theme', 'dark');
      } else {
        icon.classList.replace('fa-sun', 'fa-moon');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
