<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntraClouds</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-white transition-colors duration-300">

<nav class="fixed top-0 w-full bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 z-50">
  <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold">IC</div>
      <span class="text-2xl font-semibold">IntraClouds</span>
    </div>
    <div class="flex items-center gap-8">
      <a href="index.html" class="hover:text-blue-600 font-medium">Home</a>
      <a href="services.html" class="hover:text-blue-600 font-medium">Services</a>
      <a href="about.html" class="hover:text-blue-600 font-medium">About</a>
      <a href="contact.html" class="hover:text-blue-600 font-medium">Contact</a>
      <button id="theme-toggle" class="p-3 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800">
        <i id="theme-icon" class="fas fa-moon text-xl"></i>
      </button>
    </div>
  </div>
</nav>

<div class="pt-24">
  <h1 class="text-6xl font-bold text-center mt-20">We Transform Ideas Into Technology</h1>
</div>

<script>
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    icon.classList.replace('fa-moon', 'fa-sun');
  }
  toggle.addEventListener('click', () => {
    if (document.documentElement.classList.contains('dark')) {
      document.documentElement.classList.remove('dark');
      localStorage.theme = 'light';
      icon.classList.replace('fa-sun', 'fa-moon');
    } else {
      document.documentElement.classList.add('dark');
      localStorage.theme = 'dark';
      icon.classList.replace('fa-moon', 'fa-sun');
    }
  });
</script>
</body>
</html>
