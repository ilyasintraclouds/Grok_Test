<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntraClouds | Transform Ideas Into Technology</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors duration-300">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">IC</div>
        <div>
          <span class="text-2xl font-semibold tracking-tight">IntraClouds</span>
        </div>
      </div>

      <div class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Home</a>
        <a href="services.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Services</a>
        <a href="about.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">About</a>
        <a href="contact.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition">Contact</a>
      </div>

      <button onclick="toggleTheme()" class="p-3 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
        <i id="theme-icon" class="fas fa-moon text-xl"></i>
      </button>
    </div>
  </nav>

  <main class="pt-24">
    <!-- Hero -->
    <section class="min-h-screen bg-gradient-to-br from-blue-50 to-zinc-100 dark:from-zinc-900 dark:to-zinc-950 flex items-center">
      <div class="max-w-7xl mx-auto px-6 text-center">
        <h1 class="text-6xl md:text-7xl font-bold leading-tight mb-6">We Transform<br><span class="text-blue-600">Ideas Into Technology</span></h1>
        <p class="text-xl md:text-2xl text-zinc-600 dark:text-zinc-400 max-w-2xl mx-auto">Innovative Cloud, AI, Web & Mobile Solutions</p>
      </div>
    </section>
  </main>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      if (document.documentElement.classList.contains('dark')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
        localStorage.setItem('theme', 'dark');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
        localStorage.setItem('theme', 'light');
      }
    }

    // Load saved theme
    if (localStorage.getItem('theme') === 'dark' || (localStorage.getItem('theme') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
    }
  </script>
</body>
</html>
